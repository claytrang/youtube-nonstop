<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyTube Premium</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <style>
        body { margin: 0; background-color: #121212; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        #player-container { width: 100%; max-width: 1200px; margin: 0 auto; aspect-ratio: 16/9; background: #000; flex-shrink: 0; max-height: 65vh; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .player-controls { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 10px; background: #111; flex-shrink: 0; border-bottom: 1px solid #333; flex-wrap: wrap; }
        .player-controls button { background: #333; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .player-controls button:active { transform: scale(0.95); }
        .player-controls button.active { background: #cc0000; }
        .player-controls select { background: #333; color: white; border: 1px solid #555; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: bold; outline: none; }
        
        .controls { padding: 10px; background: #1a1a1a; display: flex; gap: 10px; flex-shrink: 0; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #333; color: white; font-size: 16px; outline: none; }
        input:focus { border: 1px solid #cc0000; }
        button.action-btn { padding: 12px 15px; border-radius: 8px; border: none; background: #cc0000; color: white; font-weight: bold; cursor: pointer; }
        button.dl-btn { background: #28a745; }
        
        .tabs { display: flex; background: #1a1a1a; flex-shrink: 0;}
        .tab { flex: 1; text-align: center; padding: 15px; cursor: pointer; font-weight: bold; border-bottom: 3px solid transparent; }
        .tab.active { border-bottom: 3px solid #cc0000; color: #cc0000; }
        
        .list-container { flex: 1; padding: 10px; padding-bottom: 80px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #222; margin-bottom: 8px; border-radius: 8px; }
        .item-title { flex: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 10px; cursor: pointer; }
        .item-title.playing { color: #cc0000; font-weight: bold; }
        .action-btns { display: flex; gap: 5px; }
        .action-btns button { padding: 8px; font-size: 12px; border: none; color: white; border-radius: 4px; cursor: pointer; }

        #toast {
            visibility: hidden; min-width: 250px; color: #fff; text-align: center; border-radius: 8px; padding: 12px; 
            position: fixed; z-index: 9999; left: 50%; bottom: 30px; transform: translateX(-50%); 
            font-size: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); opacity: 0; 
            transition: opacity 0.3s, bottom 0.3s; font-weight: bold;
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 80px; }
        #toast.success { background-color: #28a745; border: 1px solid #1e7e34; }
        #toast.error { background-color: #cc0000; border: 1px solid #8a0000; }
        #toast.loading { background-color: #333; border: 1px solid #555; }
    </style>
</head>
<body>

    <div id="player-container">
        <div id="ytplayer"></div>
    </div>

    <div class="player-controls">
        <button id="btn-shuffle" onclick="toggleShuffle()">🔀</button>
        <button onclick="playPrev()">⏮️</button>
        <button id="btn-playpause" onclick="togglePlayPause()">⏸️</button>
        <button onclick="playNext()">⏭️</button>
        <button id="btn-repeat" onclick="toggleRepeat()">🔁</button>
        <select id="playback-speed" onchange="changeSpeed()">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
        </select>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="ค้นหาเพลง / วิดีโอ...">
        <button class="action-btn" onclick="searchVideo()">🔍</button>
        <button class="action-btn dl-btn" onclick="downloadCurrentVideo()">📥 MP4</button>
    </div>

    <div class="tabs">
        <div class="tab active" id="tab-playlist" onclick="switchTab('playlist')">เพลย์ลิสต์ของฉัน</div>
        <div class="tab" id="tab-search" onclick="switchTab('search')">ผลการค้นหา</div>
    </div>

    <div class="list-container" id="list-area"></div>

    <div id="toast"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // ==========================================
        // 🔴 นำ URL ของ Apps Script มาใส่ตรงนี้
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyNJcZdAAAUoKFH0umaYO2VrAj_wmKrEuaFurUfSVQxkfinOjVfbKUqanuRLVSXbUP1/exec"; 
        
        // 🌟 รหัสผ่านฐานข้อมูล (ต้องตรงกับใน Apps Script)
        const GAS_TOKEN = "KARAOKE_VIP_9999"; 
        // ==========================================

        let player;
        let currentPlaylist = [];
        let currentIndex = -1;
        let currentMode = 'playlist'; 
        
        let isShuffle = false;
        let repeatMode = 0;

        function showToast(message, type = 'success') {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = `show ${type}`; 
            setTimeout(() => { toast.className = toast.className.replace("show", "").trim(); }, 2500);
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytplayer', {
                height: '100%', width: '100%', videoId: '',
                playerVars: { 'autoplay': 1, 'controls': 1, 'playsinline': 1 },
                events: { 'onStateChange': onPlayerStateChange }
            });
            fetchPlaylist();
        }

        function onPlayerStateChange(event) {
            const playPauseBtn = document.getElementById('btn-playpause');
            if (event.data === YT.PlayerState.PLAYING) {
                playPauseBtn.innerText = '⏸️';
                setupMediaSession();
                changeSpeed();
            } else {
                playPauseBtn.innerText = '▶️';
            }
            if (event.data === YT.PlayerState.ENDED) playNextAuto();
        }

        function togglePlayPause() {
            if (!player) return;
            if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
            else player.playVideo();
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('btn-shuffle').className = isShuffle ? 'active' : '';
        }

        function toggleRepeat() {
            repeatMode = (repeatMode + 1) % 3;
            const btn = document.getElementById('btn-repeat');
            if (repeatMode === 0) { btn.className = ''; btn.innerText = '🔁'; }
            else if (repeatMode === 1) { btn.className = 'active'; btn.innerText = '🔁'; }
            else { btn.className = 'active'; btn.innerText = '🔂'; }
        }

        function changeSpeed() {
            if (player && typeof player.setPlaybackRate === 'function') {
                const rate = parseFloat(document.getElementById('playback-speed').value);
                player.setPlaybackRate(rate);
            }
        }

        function playNextAuto() {
            if (currentPlaylist.length === 0) return;
            if (repeatMode === 2) {
                playVideo(currentPlaylist[currentIndex].videoId, currentIndex);
                return;
            }
            playNext();
        }

        function playNext() {
            if (currentPlaylist.length === 0) return;
            if (isShuffle) {
                let nextIndex = Math.floor(Math.random() * currentPlaylist.length);
                playVideo(currentPlaylist[nextIndex].videoId, nextIndex);
            } else {
                if (currentIndex < currentPlaylist.length - 1) {
                    currentIndex++;
                    playVideo(currentPlaylist[currentIndex].videoId, currentIndex);
                } else if (repeatMode === 1) {
                    currentIndex = 0;
                    playVideo(currentPlaylist[currentIndex].videoId, currentIndex);
                }
            }
        }

        function playPrev() {
            if (currentPlaylist.length === 0) return;
            if (isShuffle) {
                let prevIndex = Math.floor(Math.random() * currentPlaylist.length);
                playVideo(currentPlaylist[prevIndex].videoId, prevIndex);
            } else if (currentIndex > 0) {
                currentIndex--;
                playVideo(currentPlaylist[currentIndex].videoId, currentIndex);
            } else if (repeatMode === 1) {
                currentIndex = currentPlaylist.length - 1;
                playVideo(currentPlaylist[currentIndex].videoId, currentIndex);
            }
        }

        function playVideo(videoId, index = -1) {
            if (player && videoId) {
                player.loadVideoById(videoId);
                currentIndex = index;
                if (currentMode === 'playlist') renderList(currentPlaylist, true);
            }
        }

        async function fetchPlaylist() {
            try {
                const res = await fetch(GAS_URL);
                const data = await res.json();
                if (data.status === 'success') {
                    currentPlaylist = data.data;
                    if (currentMode === 'playlist') renderList(currentPlaylist, true);
                }
            } catch (error) {
                console.error("Error fetching playlist:", error);
            }
        }

        async function addToPlaylist(videoId, title) {
            showToast("⏳ กำลังตรวจสอบและเพิ่มเพลง...", "loading");
            try {
                const res = await fetch(GAS_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: 'add', videoId: videoId, title: title, token: GAS_TOKEN }) 
                });
                const data = await res.json();
                
                if (data.status === 'duplicate') showToast("⚠️ ซ้ำ! มีเพลงนี้ในเพลย์ลิสต์แล้ว", "error");
                else if (data.status === 'success') { showToast("✅ เพิ่มเรียบร้อย!", "success"); fetchPlaylist(); }
                else showToast(data.message || "❌ เกิดข้อผิดพลาด", "error");
            } catch (error) {
                showToast("❌ เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ", "error");
            }
        }

        async function removeFromPlaylist(videoId) {
            showToast("🗑️ กำลังลบเพลง...", "loading");
            try {
                const res = await fetch(GAS_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: 'remove', videoId: videoId, token: GAS_TOKEN }) 
                });
                const data = await res.json();
                
                if (data.status === 'success') { showToast("✅ ลบเรียบร้อย!", "success"); fetchPlaylist(); }
                else showToast(data.message || "❌ ลบไม่สำเร็จ", "error");
            } catch (error) {
                showToast("❌ ลบไม่สำเร็จ ขัดข้องทางเครือข่าย", "error");
            }
        }

        // =====================================
        // 🌟 ระบบค้นหาแบบใหม่ (ส่งไปให้ GAS ค้นหาแทน)
        // =====================================
        async function searchVideo() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;
            
            showToast("⏳ กำลังค้นหา...", "loading");
            
            try {
                // ส่งคำสั่งค้นหาไปที่เซิร์ฟเวอร์
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'search', query: query, token: GAS_TOKEN })
                });
                
                const data = await res.json();
                
                if (data.status === 'success') {
                    // แกะข้อมูลที่เซิร์ฟเวอร์ส่งกลับมา
                    const searchResults = data.data.items.map(item => ({ 
                        videoId: item.id.videoId, 
                        title: item.snippet.title 
                    }));
                    switchTab('search');
                    renderList(searchResults, false);
                    showToast("✅ ค้นหาสำเร็จ", "success");
                } else {
                    showToast("❌ " + (data.message || "เกิดข้อผิดพลาดจากเซิร์ฟเวอร์"), "error");
                }
            } catch (error) {
                showToast("❌ ค้นหาล้มเหลว ตรวจสอบอินเทอร์เน็ตของคุณ", "error");
            }
        }

        function renderList(items, isPlaylist) {
            const container = document.getElementById('list-area');
            container.innerHTML = '';
            
            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'item';
                
                const titleDiv = document.createElement('div');
                titleDiv.className = 'item-title';
                if (isPlaylist && index === currentIndex) titleDiv.classList.add('playing');
                titleDiv.innerText = item.title;
                titleDiv.onclick = () => playVideo(item.videoId, isPlaylist ? index : -1);
                
                const actionBtns = document.createElement('div');
                actionBtns.className = 'action-btns';
                
                if (isPlaylist) {
                    actionBtns.innerHTML = `<button style="background:#555;" onclick="removeFromPlaylist('${item.videoId}')">🗑️</button>`;
                } else {
                    actionBtns.innerHTML = `<button style="background:#007bff;" onclick="addToPlaylist('${item.videoId}', '${item.title.replace(/'/g, "")}')">➕ เพิ่ม</button>`;
                }

                div.appendChild(titleDiv);
                div.appendChild(actionBtns);
                container.appendChild(div);
            });
        }

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tab-playlist').className = mode === 'playlist' ? 'tab active' : 'tab';
            document.getElementById('tab-search').className = mode === 'search' ? 'tab active' : 'tab';
            if (mode === 'playlist') renderList(currentPlaylist, true);
        }

        function downloadCurrentVideo() {
            if (!player) { showToast("⚠️ ยังไม่ได้เปิดวิดีโอ", "error"); return; }
            const urlData = player.getVideoUrl();
            const videoId = urlData.split('v=')[1];
            if (videoId) {
                const downloadUrl = `https://loader.to/api/button/?url=https://www.youtube.com/watch?v=${videoId}&f=mp4`;
                window.open(downloadUrl, '_blank');
            }
        }

        function setupMediaSession() {
            if ('mediaSession' in navigator && currentIndex >= 0) {
                const videoData = currentPlaylist[currentIndex];
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: videoData ? videoData.title : 'MyTube Premium',
                    artist: 'กำลังเล่น',
                    artwork: [{ src: `https://img.youtube.com/vi/${videoData.videoId}/hqdefault.jpg`, sizes: '480x360', type: 'image/jpeg' }]
                });
                navigator.mediaSession.setActionHandler('nexttrack', playNext);
                navigator.mediaSession.setActionHandler('previoustrack', playPrev);
            }
        }

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
