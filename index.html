<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyTube Premium</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        body { margin: 0; background-color: #121212; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #121212; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #login-screen h1 { color: #fff; margin-bottom: 10px; font-size: 28px;}
        #login-screen p { color: #aaa; margin: 0 0 20px 0; }
        #login-screen input { text-align: center; font-size: 24px; padding: 15px; width: 80%; max-width: 250px; letter-spacing: 5px; border-radius: 12px; border: 2px solid #333; background: #222; color: white; outline: none; transition: 0.3s;}
        #login-screen input:focus { border-color: #cc0000; }
        #login-screen button { margin-top: 20px; padding: 12px 40px; font-size: 18px; border-radius: 8px; background: #cc0000; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s;}
        
        #player-container { width: 100%; max-width: 1200px; margin: 0 auto; aspect-ratio: 16/9; background: #000; flex-shrink: 0; max-height: 65vh; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .player-controls { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 10px; background: #111; flex-shrink: 0; border-bottom: 1px solid #333; flex-wrap: wrap; }
        .player-controls button { background: #333; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .player-controls button.active { background: #cc0000; }
        .player-controls select { background: #333; color: white; border: 1px solid #555; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: bold; outline: none; }
        
        .controls { padding: 10px; background: #1a1a1a; display: flex; gap: 10px; flex-shrink: 0; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #333; color: white; font-size: 16px; outline: none; }
        button.action-btn { padding: 12px 15px; border-radius: 8px; border: none; background: #cc0000; color: white; font-weight: bold; cursor: pointer; }
        button.dl-btn { background: #28a745; }
        
        .playlist-manager { padding: 10px; background: #1a1a1a; display: flex; gap: 10px; border-bottom: 1px solid #333; }
        .playlist-manager select { flex: 1; padding: 12px; border-radius: 8px; background: #333; color: white; border: none; font-size: 14px; font-weight: bold; outline: none; cursor: pointer; }
        
        .tabs { display: flex; background: #1a1a1a; flex-shrink: 0;}
        .tab { flex: 1; text-align: center; padding: 15px; cursor: pointer; font-weight: bold; border-bottom: 3px solid transparent; }
        .tab.active { border-bottom: 3px solid #cc0000; color: #cc0000; }
        
        /* 🌟 แถบจัดการหลายรายการ (จะแสดงเมื่อมีการติ๊ก Checkbox) */
        .bulk-manager { display: none; background: #007bff; padding: 12px 10px; flex-shrink: 0; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;}
        .bulk-manager span { font-weight: bold; font-size: 14px; color: white; }
        .bulk-btns button { padding: 8px 12px; font-size: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-left: 5px; color: white;}
        
        .list-container { flex: 1; padding: 10px; padding-bottom: 80px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #222; margin-bottom: 8px; border-radius: 8px; }
        
        /* 🌟 Checkbox สไตล์ */
        .item-checkbox { margin-right: 12px; width: 18px; height: 18px; cursor: pointer; accent-color: #cc0000; }
        
        .item-title { flex: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 10px; cursor: pointer; }
        .item-title.playing { color: #cc0000; font-weight: bold; }
        .action-btns { display: flex; gap: 5px; }
        .action-btns button { padding: 8px; font-size: 12px; border: none; color: white; border-radius: 4px; cursor: pointer; font-weight: bold;}

        #toast { visibility: hidden; min-width: 250px; color: #fff; text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 9999; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); opacity: 0; transition: opacity 0.3s, bottom 0.3s; font-weight: bold; }
        #toast.show { visibility: visible; opacity: 1; bottom: 80px; }
        #toast.success { background-color: #28a745; border: 1px solid #1e7e34; }
        #toast.error { background-color: #cc0000; border: 1px solid #8a0000; }
        #toast.loading { background-color: #333; border: 1px solid #555; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; }
        .modal-content { background: #222; padding: 25px; border-radius: 12px; width: 85%; max-width: 400px; text-align: center; border: 1px solid #444; }
        .modal-content select { width: 100%; padding: 12px; margin: 20px 0; border-radius: 8px; background: #111; color: white; border: 1px solid #555; font-size: 16px; outline: none;}
        .modal-btns { display: flex; gap: 10px; justify-content: space-between; }
        .modal-btns button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; font-size:14px;}
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>MyTube Premium</h1>
        <p>กรุณาใส่รหัสผ่านเพื่อเข้าใช้งาน</p>
        <input type="password" id="pinInput" maxlength="6" placeholder="******">
        <button onclick="checkPin()">เข้าสู่ระบบ</button>
        <div id="loginError" style="color:#ff4444; margin-top:15px; font-size:14px; font-weight:bold;"></div>
    </div>

    <div id="player-container"><div id="ytplayer"></div></div>

    <div class="player-controls">
        <button id="btn-shuffle" onclick="toggleShuffle()">🔀</button>
        <button onclick="playPrev()">⏮️</button>
        <button id="btn-playpause" onclick="togglePlayPause()">⏸️</button>
        <button onclick="playNext()">⏭️</button>
        <button id="btn-repeat" onclick="toggleRepeat()">🔁</button>
        <select id="playback-speed" onchange="changeSpeed()">
            <option value="1">1.0x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option>
        </select>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="ค้นหาเพลง / วิดีโอ...">
        <button class="action-btn" onclick="searchVideo()">🔍</button>
        <button class="action-btn dl-btn" onclick="downloadCurrentVideo()">📥 MP4</button>
    </div>

    <div class="playlist-manager">
        <select id="playlist-selector" onchange="changePlaylist()"></select>
        <button class="action-btn" onclick="createNewPlaylist()" style="background: #007bff; padding: 12px 10px;">➕ สร้าง</button>
        <button class="action-btn" onclick="deleteCurrentPlaylist()" style="background: #cc0000; padding: 12px 10px;">🗑️ ลบ</button>
    </div>

    <div class="tabs">
        <div class="tab active" id="tab-playlist" onclick="switchTab('playlist')">รายการเพลง</div>
        <div class="tab" id="tab-search" onclick="switchTab('search')">ผลการค้นหา</div>
    </div>

    <!-- 🌟 แถบจัดการหลายรายการ (ซ่อนเป็นค่าเริ่มต้น) -->
    <div class="bulk-manager" id="bulk-manager">
        <span id="bulk-count">เลือก 0 รายการ</span>
        <div class="bulk-btns" id="bulk-btns-area">
            <!-- ปุ่มจะถูกแทรกด้วย Javascript ตามหมวดหมู่ (ค้นหา หรือ เพลย์ลิสต์) -->
        </div>
    </div>

    <div class="list-container" id="list-area"></div>
    <div id="toast"></div>

    <div class="modal-overlay" id="transferModal">
        <div class="modal-content">
            <h3 style="margin:0 0 10px 0; color:#fff;" id="modal-title">ย้าย / ก๊อปปี้เพลง</h3>
            <p id="transferSongTitle" style="font-size:14px; color:#aaa; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></p>
            <select id="targetPlaylistSelect"></select>
            <div class="modal-btns">
                <button style="background: #555;" onclick="closeTransferModal()">ยกเลิก</button>
                <button style="background: #28a745;" onclick="submitTransfer('copy')">📋 ก๊อปปี้</button>
                <button style="background: #007bff;" onclick="submitTransfer('move')">🚀 ย้ายขาด</button>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // ==========================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwInArQMmpbMuNhFZev13HRq9LSvtdtjIFoRkbDmEVpx7-DuMw6eVNlDUVBpkk5kgMN/exec"; 
        let GAS_TOKEN = ""; 
        // ==========================================

        let player;
        let currentPlaylist = [];
        let currentIndex = -1;
        let currentMode = 'playlist'; 
        let isShuffle = false;
        let repeatMode = 0;
        let allPlaylists = []; 
        let activePlaylistName = ""; 
        
        // 🌟 เก็บข้อมูลเพลงที่ถูกเลือก
        let selectedItems = []; 
        let isBulkMode = false;

        document.getElementById("pinInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") { event.preventDefault(); checkPin(); }
        });

        async function checkPin() {
            const pin = document.getElementById("pinInput").value;
            if (!pin) return;
            const errorDiv = document.getElementById("loginError");
            errorDiv.innerText = "⏳ กำลังตรวจสอบ...";
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'load', playlistName: "", token: pin }) });
                const data = await res.json();
                if (data.status === 'error' && data.message.includes('Unauthorized')) {
                    errorDiv.innerText = "❌ รหัสผ่านไม่ถูกต้อง"; document.getElementById("pinInput").value = ""; 
                } else if (data.status === 'success') {
                    GAS_TOKEN = pin; 
                    document.getElementById("login-screen").style.display = "none";
                    allPlaylists = data.playlists; activePlaylistName = data.current; currentPlaylist = data.data;
                    updatePlaylistDropdown();
                    if (currentMode === 'playlist') renderList(currentPlaylist, true);
                } else { errorDiv.innerText = "❌ " + data.message; }
            } catch (err) { errorDiv.innerText = "❌ ขัดข้องทางเครือข่าย หรือลิงก์ผิด"; }
        }

        function updatePlaylistDropdown() {
            const selector = document.getElementById('playlist-selector'); selector.innerHTML = '';
            allPlaylists.forEach(name => {
                const opt = document.createElement('option'); opt.value = name; opt.innerText = "📁 " + name;
                if (name === activePlaylistName) opt.selected = true; selector.appendChild(opt);
            });
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById("toast"); toast.innerText = message; toast.className = `show ${type}`; 
            setTimeout(() => { toast.className = toast.className.replace("show", "").trim(); }, 3500); 
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytplayer', { height: '100%', width: '100%', videoId: '', playerVars: { 'autoplay': 1, 'controls': 1, 'playsinline': 1 }, events: { 'onStateChange': onPlayerStateChange } });
        }
        function onPlayerStateChange(event) {
            const btn = document.getElementById('btn-playpause');
            if (event.data === YT.PlayerState.PLAYING) { btn.innerText = '⏸️'; changeSpeed(); } else { btn.innerText = '▶️'; }
            if (event.data === YT.PlayerState.ENDED) playNextAuto();
        }
        function togglePlayPause() { if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo(); else player.playVideo(); }
        function toggleShuffle() { isShuffle = !isShuffle; document.getElementById('btn-shuffle').className = isShuffle ? 'active' : ''; }
        function toggleRepeat() { repeatMode = (repeatMode + 1) % 3; const btn = document.getElementById('btn-repeat'); btn.className = repeatMode === 0 ? '' : 'active'; btn.innerText = repeatMode === 2 ? '🔂' : '🔁'; }
        function changeSpeed() { if (player && typeof player.setPlaybackRate === 'function') player.setPlaybackRate(parseFloat(document.getElementById('playback-speed').value)); }
        
        function playNextAuto() { if (currentPlaylist.length === 0) return; if (repeatMode === 2) { playVideo(currentPlaylist[currentIndex].videoId, currentIndex); return; } playNext(); }
        function playNext() {
            if (currentPlaylist.length === 0) return;
            let nextIndex = isShuffle ? Math.floor(Math.random() * currentPlaylist.length) : (currentIndex < currentPlaylist.length - 1 ? currentIndex + 1 : (repeatMode === 1 ? 0 : currentIndex));
            playVideo(currentPlaylist[nextIndex].videoId, nextIndex);
        }
        function playPrev() {
            if (currentPlaylist.length === 0) return;
            let prevIndex = isShuffle ? Math.floor(Math.random() * currentPlaylist.length) : (currentIndex > 0 ? currentIndex - 1 : (repeatMode === 1 ? currentPlaylist.length - 1 : currentIndex));
            playVideo(currentPlaylist[prevIndex].videoId, prevIndex);
        }
        function playVideo(videoId, index = -1) {
            if (player && videoId) { player.loadVideoById(videoId); currentIndex = index; if (currentMode === 'playlist') renderList(currentPlaylist, true); }
        }

        async function fetchPlaylist(targetName = "") {
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'load', playlistName: targetName, token: GAS_TOKEN }) });
                const data = await res.json();
                if (data.status === 'success') {
                    allPlaylists = data.playlists; activePlaylistName = data.current; currentPlaylist = data.data;
                    updatePlaylistDropdown();
                    if (currentMode === 'playlist') renderList(currentPlaylist, true);
                }
            } catch (error) {}
        }
        async function changePlaylist() {
            showToast("🔄 กำลังโหลดข้อมูล...", "loading");
            await fetchPlaylist(document.getElementById('playlist-selector').value);
            showToast("✅ โหลดสำเร็จ", "success"); switchTab('playlist');
        }
        async function createNewPlaylist() {
            const newName = prompt("🎵 ตั้งชื่อแฟ้มเพลงใหม่:"); if (!newName || newName.trim() === "") return;
            showToast("⏳ กำลังสร้างแฟ้มใหม่...", "loading");
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'create_playlist', playlistName: newName, token: GAS_TOKEN }) });
                const data = await res.json();
                if (data.status === 'success') { showToast("✅ สร้างสำเร็จ!", "success"); await fetchPlaylist(newName); } else showToast("❌ " + data.message, "error");
            } catch (error) { showToast("❌ ขัดข้อง", "error"); }
        }
        async function deleteCurrentPlaylist() {
            if (allPlaylists.length <= 1) { showToast("⚠️ ไม่สามารถลบแฟ้มสุดท้ายได้", "error"); return; }
            if (!confirm(`⚠️ ลบแฟ้ม "${activePlaylistName}" ใช่หรือไม่?\n(กู้คืนไม่ได้)`)) return;
            showToast("⏳ กำลังลบแฟ้ม...", "loading");
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'delete_playlist', playlistName: activePlaylistName, token: GAS_TOKEN }) });
                const data = await res.json();
                if (data.status === 'success') { showToast("✅ ลบแฟ้มสำเร็จ!", "success"); await fetchPlaylist(""); } else showToast("❌ " + data.message, "error");
            } catch (error) { showToast("❌ ขัดข้อง", "error"); }
        }

        async function searchVideo() {
            const query = document.getElementById('searchInput').value; if (!query) return;
            showToast("⏳ กำลังค้นหา...", "loading");
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'search', query: query, token: GAS_TOKEN }) });
                const data = await res.json();
                if (data.status === 'success') {
                    const searchResults = data.data.items.map(item => ({ videoId: item.id.videoId, title: item.snippet.title }));
                    switchTab('search'); renderList(searchResults, false); showToast("✅ ค้นหาสำเร็จ", "success");
                } else showToast("❌ " + (data.message || "เกิดข้อผิดพลาด"), "error");
            } catch (error) { showToast("❌ ขัดข้อง", "error"); }
        }

        // =====================================
        // 🌟 ระบบจัดการ UI สำหรับเลือกหลายรายการ
        // =====================================
        function toggleSelection(videoId, title, isChecked) {
            if (isChecked) {
                selectedItems.push({ videoId, title });
            } else {
                selectedItems = selectedItems.filter(item => item.videoId !== videoId);
            }
            updateBulkManagerUI();
        }

        function updateBulkManagerUI() {
            const bulkManager = document.getElementById('bulk-manager');
            const bulkCount = document.getElementById('bulk-count');
            const bulkBtnsArea = document.getElementById('bulk-btns-area');
            
            if (selectedItems.length > 0) {
                bulkManager.style.display = 'flex';
                bulkCount.innerText = `เลือก ${selectedItems.length} รายการ`;
                
                if (currentMode === 'playlist') {
                    bulkBtnsArea.innerHTML = `
                        <button style="background: #28a745;" onclick="openTransferModal(true)">🔄 ย้าย/ก๊อป</button>
                        <button style="background: #cc0000;" onclick="bulkExecute('remove')">🗑️ ลบที่เลือก</button>
                    `;
                } else {
                    bulkBtnsArea.innerHTML = `<button style="background: #28a745;" onclick="bulkExecute('add')">➕ เพิ่มเข้าแฟ้มนี้</button>`;
                }
            } else {
                bulkManager.style.display = 'none';
            }
        }

        function switchTab(mode) {
            currentMode = mode;
            selectedItems = []; // เคลียร์การเลือกเมื่อสลับแท็บ
            updateBulkManagerUI();
            
            document.getElementById('tab-playlist').className = mode === 'playlist' ? 'tab active' : 'tab';
            document.getElementById('tab-search').className = mode === 'search' ? 'tab active' : 'tab';
            if (mode === 'playlist') renderList(currentPlaylist, true);
        }

        function renderList(items, isPlaylist) {
            const container = document.getElementById('list-area'); container.innerHTML = '';
            items.forEach((item, index) => {
                const div = document.createElement('div'); div.className = 'item';
                
                // 🌟 เพิ่ม Checkbox เข้าไป
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'item-checkbox';
                // ถ้าเคยติ๊กไว้แล้ว ให้ติ๊กค้างไว้
                if (selectedItems.some(s => s.videoId === item.videoId)) checkbox.checked = true;
                checkbox.onchange = (e) => toggleSelection(item.videoId, item.title, e.target.checked);

                const titleDiv = document.createElement('div'); titleDiv.className = 'item-title';
                if (isPlaylist && index === currentIndex) titleDiv.classList.add('playing');
                titleDiv.innerText = item.title; titleDiv.onclick = () => playVideo(item.videoId, isPlaylist ? index : -1);
                
                const actionBtns = document.createElement('div'); actionBtns.className = 'action-btns';
                if (isPlaylist) {
                    actionBtns.innerHTML = `
                        <button style="background:#007bff;" onclick="openTransferModal(false, '${item.videoId}', '${item.title.replace(/'/g, "").replace(/"/g, "")}')">🔄</button>
                        <button style="background:#555;" onclick="singleAction('remove', '${item.videoId}', '')">🗑️</button>
                    `;
                } else {
                    actionBtns.innerHTML = `<button style="background:#007bff;" onclick="singleAction('add', '${item.videoId}', '${item.title.replace(/'/g, "").replace(/"/g, "")}')">➕</button>`;
                }
                
                div.appendChild(checkbox);
                div.appendChild(titleDiv); 
                div.appendChild(actionBtns); 
                container.appendChild(div);
            });
        }

        // =====================================
        // 🌟 ระบบประมวลผลหลังบ้าน (รวมเดี่ยวและกลุ่ม)
        // =====================================
        async function singleAction(mode, videoId, title) {
            selectedItems = [{ videoId, title }];
            await bulkExecute(mode);
            selectedItems = []; // เคลียร์
            updateBulkManagerUI();
        }

        async function bulkExecute(mode) {
            if (selectedItems.length === 0) return;
            if (mode === 'remove' && !confirm(`⚠️ ยืนยันการลบ ${selectedItems.length} เพลง ใช่หรือไม่?`)) return;
            
            showToast(`⏳ กำลังดำเนินการ...`, "loading");
            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'bulk_action', 
                        mode: mode,
                        items: selectedItems,
                        targetPlaylist: activePlaylistName, // สำหรับการ Add
                        sourcePlaylist: activePlaylistName, // สำหรับการ Remove
                        token: GAS_TOKEN 
                    })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    showToast(`✅ ${data.message}`, "success");
                    selectedItems = []; // ล้างการเลือก
                    updateBulkManagerUI();
                    if (currentMode === 'playlist') fetchPlaylist(activePlaylistName);
                } else { showToast("❌ " + data.message, "error"); }
            } catch (err) { showToast("❌ ขัดข้องทางเครือข่าย", "error"); }
        }

        function openTransferModal(isBulk, videoId = '', title = '') {
            const targets = allPlaylists.filter(name => name !== activePlaylistName);
            if (targets.length === 0) { showToast("⚠️ ต้องสร้างแฟ้มใหม่อย่างน้อย 1 แฟ้มก่อน", "error"); return; }
            
            if (!isBulk) {
                // กรณีกดปุ่มย้ายทีละเพลง
                selectedItems = [{ videoId: videoId, title: title }];
                document.getElementById('transferSongTitle').innerText = title;
                document.getElementById('modal-title').innerText = "ย้าย / ก๊อปปี้เพลง";
            } else {
                // กรณีกดปุ่มย้ายหลายเพลง
                document.getElementById('transferSongTitle').innerText = `(เลือกไว้ ${selectedItems.length} เพลง)`;
                document.getElementById('modal-title').innerText = "ทำรายการหลายเพลง";
            }
            
            const select = document.getElementById('targetPlaylistSelect'); select.innerHTML = '';
            targets.forEach(name => {
                const opt = document.createElement('option'); opt.value = name; opt.innerText = "➡️ ส่งไปที่: " + name; select.appendChild(opt);
            });
            document.getElementById('transferModal').style.display = 'flex';
        }

        function closeTransferModal() { document.getElementById('transferModal').style.display = 'none'; if(selectedItems.length === 1) selectedItems = []; }

        async function submitTransfer(mode) {
            const targetName = document.getElementById('targetPlaylistSelect').value;
            if (!targetName || selectedItems.length === 0) return;
            
            closeTransferModal();
            showToast(`⏳ กำลังส่งข้อมูล...`, "loading");
            
            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'bulk_action', 
                        mode: mode, // 'copy' หรือ 'move'
                        items: selectedItems,
                        sourcePlaylist: activePlaylistName, 
                        targetPlaylist: targetName, 
                        token: GAS_TOKEN 
                    })
                });
                const data = await res.json();
                if (data.status === 'success') { 
                    showToast(`✅ ${data.message}`, "success"); 
                    selectedItems = []; updateBulkManagerUI();
                    if (mode === 'move') fetchPlaylist(activePlaylistName); 
                } 
                else { showToast("❌ " + data.message, "error"); }
            } catch (error) { showToast("❌ ขัดข้อง", "error"); }
        }

        function downloadCurrentVideo() {
            if (!player) return; const urlData = player.getVideoUrl(); const videoId = urlData.split('v=')[1];
            if (videoId) window.open(`https://loader.to/api/button/?url=https://www.youtube.com/watch?v=${videoId}&f=mp4`, '_blank');
        }

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
